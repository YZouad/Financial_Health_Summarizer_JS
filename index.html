<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEC Financial Analyzer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      width: 8px;
    }

    body::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    body::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px;
    }

    body::-webkit-scrollbar-thumb:hover {
      background: #333;
    }

    .section-divider {
      border-left: 1px solid #222;
      padding-left: 24px;
      transition: border-color 0.3s;
    }

    .section-divider:hover {
      border-left-color: #333;
    }

    .metric-card {
      background: rgba(10, 10, 10, 0.5);
      border: 1px solid #1a1a1a;
      transition: all 0.3s ease;
    }

    .metric-card:hover {
      border-color: #2a2a2a;
      background: rgba(15, 15, 15, 0.5);
    }

    .expandable-section {
      border-left: 1px solid #222;
      transition: border-color 0.3s;
      cursor: pointer;
    }

    .expandable-section:hover {
      border-left-color: #333;
    }

    .expand-icon {
      width: 10px;
      height: 10px;
      border-right: 2px solid #666;
      border-bottom: 2px solid #666;
      transform: rotate(45deg);
      transition: all 0.3s ease;
      margin-top: -3px;
    }

    .expandable-section.expanded .expand-icon {
      transform: rotate(-135deg);
      margin-top: 3px;
    }

    .status-good { color: #10b981; }
    .status-neutral { color: #f59e0b; }
    .status-poor { color: #ef4444; }

    input:focus, select:focus, button:focus {
      outline: none;
      border-color: #444 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function FinancialAnalyzer() {
    const [ticker, setTicker] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [companyData, setCompanyData] = useState(null);
    const [availableYears, setAvailableYears] = useState([]);
    const [selectedYear, setSelectedYear] = useState('');
    const [analysis, setAnalysis] = useState(null);
    const [yearComparison, setYearComparison] = useState(null);
    const [showDataSources, setShowDataSources] = useState(false);
    
    // User credentials
    const [showCredentialsModal, setShowCredentialsModal] = useState(true);
    const [userOrg, setUserOrg] = useState('');
    const [userEmail, setUserEmail] = useState('');
    const [credentialsSet, setCredentialsSet] = useState(false);
    const [userAgent, setUserAgent] = useState('');
    
    const chartsRef = useRef({});

    // Check if credentials are already set (in memory)
    useEffect(() => {
        if (userAgent) {
        setCredentialsSet(true);
        setShowCredentialsModal(false);
        }
    }, [userAgent]);

    const handleSetCredentials = () => {
        if (!userOrg.trim() || !userEmail.trim()) {
        setError('Please provide both organization and email');
        return;
        }
        
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(userEmail)) {
        setError('Please provide a valid email address');
        return;
        }
        
        const ua = `${userOrg.trim()} ${userEmail.trim()}`;
        setUserAgent(ua);
        setCredentialsSet(true);
        setShowCredentialsModal(false);
        setError('');
    };

    const formatNumber = (num) => {
        if (num === null || num === undefined || isNaN(num)) return 'N/A';
        if (Math.abs(num) >= 1e9) return `$${(num / 1e9).toFixed(2)}B`;
        if (Math.abs(num) >= 1e6) return `$${(num / 1e6).toFixed(2)}M`;
        if (Math.abs(num) >= 1e3) return `$${(num / 1e3).toFixed(2)}K`;
        return `$${num.toFixed(2)}`;
    };

    const formatPercent = (num) => {
        if (num === null || num === undefined || isNaN(num)) return 'N/A';
        return `${num.toFixed(2)}%`;
    };

    const formatRatio = (num) => {
        if (num === null || num === undefined || isNaN(num)) return 'N/A';
        return num.toFixed(2);
    };

    const getCIKFromTicker = async (tickerSymbol) => {
        const apiUrl = 'http://localhost:3000/api/company-tickers';
        const response = await fetch(apiUrl, {
        headers: {
            'X-User-Agent': userAgent
        }
        });
        if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.message || 'Failed to fetch company list');
        }
        const data = await response.json();
        const company = Object.values(data).find(
        c => c.ticker && c.ticker.toLowerCase() === tickerSymbol.toLowerCase()
        );
        return company ? String(company.cik_str).padStart(10, '0') : null;
    };

      const getAvailableYears = (facts) => {
        const years = new Set();
        const revenueConcepts = ['Revenues', 'RevenueFromContractWithCustomerExcludingAssessedTax', 'SalesRevenueNet'];
        
        for (const concept of revenueConcepts) {
          if (facts[concept] && facts[concept].units['USD']) {
            const data = facts[concept].units['USD'];
            data.forEach(item => {
              if (item.fy && (item.form === '10-K' || item.form === '10-K/A' || item.fp === 'FY')) {
                years.add(item.fy);
              }
            });
          }
        }
        return Array.from(years).sort((a, b) => b - a);
      };

      const getValueForYear = (facts, concept, year, units = 'USD') => {
        if (!facts || !facts[concept]) return null;
        const unitData = facts[concept].units[units] || facts[concept].units['shares'];
        if (!unitData || !Array.isArray(unitData)) return null;
        
        const yearData = unitData.filter(item => 
          item.fy === year && 
          (item.form === '10-K' || item.form === '10-K/A' || item.fp === 'FY')
        );
        
        if (yearData.length === 0) return null;
        yearData.sort((a, b) => new Date(b.end) - new Date(a.end));
        return yearData[0];
      };

      // Helper to try multiple concept names and return the first found, with metadata
      const getValueWithFallback = (facts, concepts, year, units = 'USD') => {
        for (const concept of concepts) {
          const value = getValueForYear(facts, concept, year, units);
          if (value) {
            return { ...value, concept, confidence: 'high' };
          }
        }
        return { val: null, concept: 'none', confidence: 'none' };
      };

      const calculateMetricsForYear = (facts, year) => {
        // Track data sources for transparency
        const dataSources = {};
        
        // Income Statement - try multiple concepts
        const revenue = getValueWithFallback(facts, [
          'Revenues',
          'RevenueFromContractWithCustomerExcludingAssessedTax',
          'SalesRevenueNet',
          'RevenueFromContractWithCustomerIncludingAssessedTax'
        ], year);
        dataSources.revenue = revenue.concept;
        
        const costOfRevenue = getValueWithFallback(facts, [
          'CostOfRevenue',
          'CostOfGoodsAndServicesSold',
          'CostOfGoodsSold'
        ], year);
        dataSources.costOfRevenue = costOfRevenue.concept;
        
        const grossProfit = getValueWithFallback(facts, ['GrossProfit'], year);
        dataSources.grossProfit = grossProfit.concept;
        
        const operatingIncome = getValueWithFallback(facts, [
          'OperatingIncomeLoss',
          'IncomeLossFromOperations'
        ], year);
        dataSources.operatingIncome = operatingIncome.concept;
        
        const netIncome = getValueWithFallback(facts, [
          'NetIncomeLoss',
          'ProfitLoss'
        ], year);
        dataSources.netIncome = netIncome.concept;
        
        const operatingExpenses = getValueWithFallback(facts, [
          'OperatingExpenses',
          'CostsAndExpenses'
        ], year);
        
        const researchDevelopment = getValueWithFallback(facts, [
          'ResearchAndDevelopmentExpense'
        ], year);
        
        const sellingGeneralAdmin = getValueWithFallback(facts, [
          'SellingGeneralAndAdministrativeExpense'
        ], year);
        
        const interestExpense = getValueWithFallback(facts, [
          'InterestExpense',
          'InterestExpenseDebt'
        ], year);
        
        const taxExpense = getValueWithFallback(facts, [
          'IncomeTaxExpenseBenefit',
          'IncomeTaxesPaid'
        ], year);
        
        // Balance Sheet
        const totalAssets = getValueWithFallback(facts, ['Assets'], year);
        dataSources.totalAssets = totalAssets.concept;
        
        const currentAssets = getValueWithFallback(facts, ['AssetsCurrent'], year);
        dataSources.currentAssets = currentAssets.concept;
        
        const cash = getValueWithFallback(facts, [
          'CashAndCashEquivalentsAtCarryingValue',
          'Cash',
          'CashCashEquivalentsAndShortTermInvestments'
        ], year);
        
        const inventories = getValueWithFallback(facts, [
          'InventoryNet',
          'Inventory'
        ], year);
        
        const accountsReceivable = getValueWithFallback(facts, [
          'AccountsReceivableNetCurrent',
          'AccountsReceivableNet'
        ], year);
        
        const totalLiabilities = getValueWithFallback(facts, ['Liabilities'], year);
        dataSources.totalLiabilities = totalLiabilities.concept;
        
        const currentLiabilities = getValueWithFallback(facts, ['LiabilitiesCurrent'], year);
        dataSources.currentLiabilities = currentLiabilities.concept;
        
        // IMPROVED DEBT CALCULATION - Only interest-bearing debt : to come back to : Revise again
        const longTermDebt = getValueWithFallback(facts, [
          'LongTermDebt',
          'LongTermDebtNoncurrent',
          'LongTermDebtAndCapitalLeaseObligations'
        ], year);
        dataSources.longTermDebt = longTermDebt.concept;
        
        const shortTermDebt = getValueWithFallback(facts, [
          'DebtCurrent',
          'ShortTermBorrowings',
          'CommercialPaper'
        ], year);
        dataSources.shortTermDebt = shortTermDebt.concept;
        
        // Calculate total interest-bearing debt
        const totalDebt = (longTermDebt?.val || 0) + (shortTermDebt?.val || 0);
        
        const stockholdersEquity = getValueWithFallback(facts, [
          'StockholdersEquity',
          'ShareholdersEquity'
        ], year);
        dataSources.stockholdersEquity = stockholdersEquity.concept;
        
        // Cash Flow
        const operatingCashFlow = getValueWithFallback(facts, [
          'NetCashProvidedByUsedInOperatingActivities'
        ], year);
        dataSources.operatingCashFlow = operatingCashFlow.concept;
        
        const investingCashFlow = getValueWithFallback(facts, [
          'NetCashProvidedByUsedInInvestingActivities'
        ], year);
        
        const financingCashFlow = getValueWithFallback(facts, [
          'NetCashProvidedByUsedInFinancingActivities'
        ], year);
        
        const capex = getValueWithFallback(facts, [
          'PaymentsToAcquirePropertyPlantAndEquipment',
          'CapitalExpenditures'
        ], year);
        dataSources.capex = capex.concept;
        
        const dividendsPaid = getValueWithFallback(facts, [
          'PaymentsOfDividends',
          'DividendsPaid'
        ], year);
        
        // Shares
        const commonShares = getValueWithFallback(facts, [
          'CommonStockSharesOutstanding',
          'SharesOutstanding'
        ], year, 'shares');
        dataSources.shares = commonShares.concept;
        
        // Extract values
        const revenueVal = revenue?.val || 0;
        const costOfRevenueVal = costOfRevenue?.val || 0;
        
        // Calculate or use reported gross profit
        let grossProfitVal = grossProfit?.val;
        let grossProfitCalculated = false;
        if (!grossProfitVal && revenueVal && costOfRevenueVal) {
          grossProfitVal = revenueVal - costOfRevenueVal;
          grossProfitCalculated = true;
        }
        
        const operatingIncomeVal = operatingIncome?.val || 0;
        const netIncomeVal = netIncome?.val || 0;
        const interestExpenseVal = interestExpense?.val || 0;
        const taxExpenseVal = taxExpense?.val || 0;
        
        // Calculate EBIT (Earnings Before Interest & Taxes)
        let ebitVal = netIncomeVal + interestExpenseVal + taxExpenseVal;
        
        const totalAssetsVal = totalAssets?.val || 0;
        const currentAssetsVal = currentAssets?.val || 0;
        const cashVal = cash?.val || 0;
        const inventoriesVal = inventories?.val || 0;
        const accountsReceivableVal = accountsReceivable?.val || 0;
        
        const totalLiabilitiesVal = totalLiabilities?.val || 0;
        const currentLiabilitiesVal = currentLiabilities?.val || 0;
        const longTermDebtVal = longTermDebt?.val || 0;
        const shortTermDebtVal = shortTermDebt?.val || 0;
        const totalDebtVal = totalDebt;
        
        const equityVal = stockholdersEquity?.val || 0;
        
        const ocfVal = operatingCashFlow?.val || 0;
        const investingCfVal = investingCashFlow?.val || 0;
        const financingCfVal = financingCashFlow?.val || 0;
        const capexVal = Math.abs(capex?.val || 0);
        const dividendsVal = Math.abs(dividendsPaid?.val || 0);
        
        const sharesVal = commonShares?.val || 0;

        // Calculate ALL the metrics
        // Profitability Ratios
        const grossMargin = revenueVal !== 0 && grossProfitVal ? (grossProfitVal / revenueVal) * 100 : null;
        const operatingMargin = revenueVal !== 0 ? (operatingIncomeVal / revenueVal) * 100 : null;
        const netMargin = revenueVal !== 0 ? (netIncomeVal / revenueVal) * 100 : null;
        const roe = equityVal !== 0 ? (netIncomeVal / equityVal) * 100 : null;
        const roa = totalAssetsVal !== 0 ? (netIncomeVal / totalAssetsVal) * 100 : null;
        
        // ROIC = NOPAT / Invested Capital
        // NOPAT = Operating Income * (1 - Tax Rate)
        // Invested Capital = Debt + Equity
        const taxRate = (netIncomeVal + taxExpenseVal) !== 0 ? taxExpenseVal / (netIncomeVal + taxExpenseVal) : 0.21;
        const nopat = operatingIncomeVal * (1 - taxRate);
        const investedCapital = totalDebtVal + equityVal;
        const roic = investedCapital !== 0 ? (nopat / investedCapital) * 100 : null;
        
        // Liquidity Ratios
        const currentRatio = currentLiabilitiesVal !== 0 ? currentAssetsVal / currentLiabilitiesVal : null;
        const quickRatio = currentLiabilitiesVal !== 0 ? (currentAssetsVal - inventoriesVal) / currentLiabilitiesVal : null;
        const cashRatio = currentLiabilitiesVal !== 0 ? cashVal / currentLiabilitiesVal : null;
        
        // Leverage Ratios - Using interest-bearing debt only
        const debtToEquity = equityVal !== 0 ? totalDebtVal / equityVal : null;
        const debtToAssets = totalAssetsVal !== 0 ? totalDebtVal / totalAssetsVal : null;
        const equityMultiplier = equityVal !== 0 ? totalAssetsVal / equityVal : null;
        const interestCoverage = interestExpenseVal !== 0 && ebitVal ? ebitVal / interestExpenseVal : null;
        
        // Efficiency Ratios
        const assetTurnover = totalAssetsVal !== 0 ? revenueVal / totalAssetsVal : null;
        const inventoryTurnover = inventoriesVal !== 0 ? costOfRevenueVal / inventoriesVal : null;
        const receivablesTurnover = accountsReceivableVal !== 0 ? revenueVal / accountsReceivableVal : null;
        const daysSalesOutstanding = receivablesTurnover !== 0 && receivablesTurnover ? 365 / receivablesTurnover : null;
        const daysInventoryOutstanding = inventoryTurnover !== 0 && inventoryTurnover ? 365 / inventoryTurnover : null;
        
        // Cash Flow Metrics
        const freeCashFlow = ocfVal - capexVal;
        const fcfMargin = revenueVal !== 0 ? (freeCashFlow / revenueVal) * 100 : null;
        const ocfToNetIncome = netIncomeVal !== 0 ? ocfVal / netIncomeVal : null;
        const cashFlowToDebt = totalDebtVal !== 0 ? ocfVal / totalDebtVal : null;
        
        // Per Share Metrics
        const eps = sharesVal !== 0 ? netIncomeVal / sharesVal : null;
        const bookValuePerShare = sharesVal !== 0 ? equityVal / sharesVal : null;
        const cashPerShare = sharesVal !== 0 ? cashVal / sharesVal : null;
        const fcfPerShare = sharesVal !== 0 ? freeCashFlow / sharesVal : null;

        // Data quality score
        const dataQuality = {
          score: 0,
          total: 0,
          details: {}
        };
        
        const checkDataQuality = (name, hasValue, isCalculated = false) => {
          dataQuality.total++;
          if (hasValue) {
            dataQuality.score++;
            dataQuality.details[name] = isCalculated ? 'calculated' : 'reported';
          } else {
            dataQuality.details[name] = 'missing';
          }
        };
        
        checkDataQuality('revenue', revenueVal);
        checkDataQuality('netIncome', netIncomeVal);
        checkDataQuality('totalAssets', totalAssetsVal);
        checkDataQuality('stockholdersEquity', equityVal);
        checkDataQuality('operatingCashFlow', ocfVal);
        checkDataQuality('grossProfit', grossProfitVal, grossProfitCalculated);
        checkDataQuality('operatingIncome', operatingIncomeVal);
        checkDataQuality('debt', totalDebtVal > 0);

        return {
          periodEnd: revenue?.end || netIncome?.end || 'N/A',
          fiscalYear: year,
          dataSources,
          dataQuality: {
            ...dataQuality,
            percentage: (dataQuality.score / dataQuality.total * 100).toFixed(0)
          },
          rawValues: {
            revenue: revenueVal,
            costOfRevenue: costOfRevenueVal,
            grossProfit: grossProfitVal,
            operatingIncome: operatingIncomeVal,
            netIncome: netIncomeVal,
            ebit: ebitVal,
            totalAssets: totalAssetsVal,
            currentAssets: currentAssetsVal,
            cash: cashVal,
            inventories: inventoriesVal,
            accountsReceivable: accountsReceivableVal,
            totalLiabilities: totalLiabilitiesVal,
            currentLiabilities: currentLiabilitiesVal,
            longTermDebt: longTermDebtVal,
            shortTermDebt: shortTermDebtVal,
            totalDebt: totalDebtVal,
            stockholdersEquity: equityVal,
            operatingCashFlow: ocfVal,
            freeCashFlow: freeCashFlow,
            capex: capexVal,
            dividends: dividendsVal,
            shares: sharesVal
          },
          profitability: {
            grossMargin,
            operatingMargin,
            netMargin,
            roe,
            roa,
            roic
          },
          liquidity: {
            currentRatio,
            quickRatio,
            cashRatio
          },
          leverage: {
            debtToEquity,
            debtToAssets,
            equityMultiplier,
            interestCoverage
          },
          efficiency: {
            assetTurnover,
            inventoryTurnover,
            receivablesTurnover,
            daysSalesOutstanding,
            daysInventoryOutstanding
          },
          cashFlow: {
            freeCashFlow,
            fcfMargin,
            ocfToNetIncome,
            cashFlowToDebt
          },
          perShare: {
            eps,
            bookValuePerShare,
            cashPerShare,
            fcfPerShare
          },
          notes: {
            grossProfitCalculated,
            debtDefinition: 'Interest-bearing debt only (excludes accounts payable, accrued expenses, etc.)'
          }
        };
      };

      const analyzeCompany = async () => {
        if (!credentialsSet) {
            setShowCredentialsModal(true);
            setError('Please provide your contact information first');
            return;
        }

        if (!ticker.trim()) {
            setError('Please enter a ticker symbol');
            return;
        }

        setLoading(true);
        setError('');
        setCompanyData(null);
        setAvailableYears([]);
        setSelectedYear('');
        setAnalysis(null);

        try {
            const cik = await getCIKFromTicker(ticker.trim());
            if (!cik) throw new Error('Ticker symbol not found');

            const apiUrl = `http://localhost:3000/api/company-facts/${cik}`;
            const response = await fetch(apiUrl, {
            headers: {
                'X-User-Agent': userAgent
            }
            });
            
            if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.message || 'Failed to fetch company data');
            }

            const data = await response.json();
            const facts = data.facts['us-gaap'];
            const years = getAvailableYears(facts);
            
            if (years.length === 0) throw new Error('No annual financial data found');
            
            setCompanyData(data);
            setAvailableYears(years);
            setSelectedYear(years[0]);
            
            const metrics = calculateMetricsForYear(facts, years[0]);
            setAnalysis({
            companyName: data.entityName,
            ...metrics
            });

            // Calculate year-over-year comparison if we have multiple years
            if (years.length > 1) {
            const prevYearMetrics = calculateMetricsForYear(facts, years[1]);
            setYearComparison({
                currentYear: years[0],
                previousYear: years[1],
                current: metrics,
                previous: prevYearMetrics
            });
            }
            
        } catch (err) {
            setError(err.message);
            console.error('Analysis error:', err);
        } finally {
            setLoading(false);
        }
        };

      const handleYearChange = (year) => {
        setSelectedYear(year);
        const facts = companyData.facts['us-gaap'];
        const metrics = calculateMetricsForYear(facts, parseInt(year));
        setAnalysis({
          companyName: companyData.entityName,
          ...metrics
        });

        // Update comparison
        const yearIndex = availableYears.indexOf(parseInt(year));
        if (yearIndex < availableYears.length - 1) {
          const prevYear = availableYears[yearIndex + 1];
          const prevYearMetrics = calculateMetricsForYear(facts, prevYear);
          setYearComparison({
            currentYear: parseInt(year),
            previousYear: prevYear,
            current: metrics,
            previous: prevYearMetrics
          });
        } else {
          setYearComparison(null);
        }
      };

      const getHealthStatus = (value, thresholds) => {
        if (value === null || value === undefined || isNaN(value)) return 'neutral';
        if (value >= thresholds.good) return 'good';
        if (value >= thresholds.neutral) return 'neutral';
        return 'poor';
      };

      const getHealthStatusInverse = (value, thresholds) => {
        if (value === null || value === undefined || isNaN(value)) return 'neutral';
        if (value <= thresholds.good) return 'good';
        if (value <= thresholds.neutral) return 'neutral';
        return 'poor';
      };

      const StatusBadge = ({ status }) => {
        const colors = {
          good: 'status-good',
          neutral: 'status-neutral',
          poor: 'status-poor'
        };
        return (
          <span className={`text-xs font-light tracking-wider uppercase ${colors[status]}`}>
            {status}
          </span>
        );
      };

      const MetricCard = ({ title, value, format = 'number', status, subtitle, note }) => (
        <div className="metric-card rounded-lg p-5">
          <div className="flex items-start justify-between mb-3">
            <h4 className="text-xs font-medium text-gray-500 uppercase tracking-wider">{title}</h4>
            {status && <StatusBadge status={status} />}
          </div>
          <p className="text-2xl font-light text-white mb-1">
            {format === 'percent' ? formatPercent(value) : 
             format === 'ratio' ? formatRatio(value) : 
             formatNumber(value)}
          </p>
          {subtitle && <p className="text-xs text-gray-600 font-light">{subtitle}</p>}
          {note && <p className="text-xs text-gray-500 mt-1 font-light">{note}</p>}
        </div>
      );

      const YoYChange = ({ current, previous, format = 'number' }) => {
        if (!current || !previous || current === 0 || previous === 0) return <span className="text-gray-400">N/A</span>;
        const change = ((current - previous) / Math.abs(previous)) * 100;
        const isPositive = change > 0;
        return (
          <span className={isPositive ? 'text-green-500' : 'text-red-500'}>
            {isPositive ? '↑' : '↓'} {Math.abs(change).toFixed(1)}%
          </span>
        );
      };

      useEffect(() => {
        if (analysis && availableYears.length > 0) {
          createTrendCharts();
        }
        
        return () => {
          Object.values(chartsRef.current).forEach(chart => {
            if (chart) chart.destroy();
          });
        };
      }, [analysis, availableYears]);

      const createTrendCharts = () => {
        if (!companyData || availableYears.length < 2) return;
        
        const facts = companyData.facts['us-gaap'];
        const years = availableYears.slice(0, 5).reverse();
        const multiYearData = years.map(year => calculateMetricsForYear(facts, year));
        
        createRevenueChart(years, multiYearData);
        createMarginsChart(years, multiYearData);
        createCashFlowChart(years, multiYearData);
        createRatiosChart(years, multiYearData);
      };

      const createRevenueChart = (years, data) => {
        const ctx = document.getElementById('revenue-chart');
        if (!ctx) return;

                    />
                    <MetricCard 
                      title="OCF to Net Income" 
                      value={analysis.cashFlow.ocfToNetIncome} 
                      format="ratio"
                      status={getHealthStatus(analysis.cashFlow.ocfToNetIncome, {good: 1.2, neutral: 0.8})}
                      subtitle="Quality of earnings"
                    />
                    <MetricCard 
                      title="Cash Flow to Debt" 
                      value={analysis.cashFlow.cashFlowToDebt} 
                      format="ratio"
                      status={getHealthStatus(analysis.cashFlow.cashFlowToDebt, {good: 0.25, neutral: 0.15})}
                      subtitle="OCF / Total Debt"
                    />
                    <MetricCard 
                      title="CapEx" 
                      value={analysis.rawValues.capex}
                      subtitle="Capital Expenditures"
                    />
                  </div>
                </div>

                {/* Per Share Metrics */}
                <div className="mb-8 section-divider">
                  <h3 className="text-xs font-medium text-gray-500 uppercase tracking-wider mb-6">Per Share Metrics</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <MetricCard 
                      title="Earnings Per Share" 
                      value={analysis.perShare.eps}
                      subtitle={`${formatNumber(analysis.rawValues.shares)} shares outstanding`}
                    />
                    <MetricCard 
                      title="Book Value Per Share" 
                      value={analysis.perShare.bookValuePerShare}
                      subtitle="Equity / Shares"
                    />
                    <MetricCard 
                      title="Cash Per Share" 
                      value={analysis.perShare.cashPerShare}
                      subtitle="Cash / Shares"
                    />
                    <MetricCard 
                      title="FCF Per Share" 
                      value={analysis.perShare.fcfPerShare}
                      subtitle="Free Cash Flow / Shares"
                    />
                  </div>
                </div>

                {/* Year-over-Year Comparison */}
                {yearComparison && (
                  <div className="mb-8 section-divider">
                    <h3 className="text-xs font-medium text-gray-500 uppercase tracking-wider mb-6">
                      YoY Change ({yearComparison.currentYear} vs {yearComparison.previousYear})
                    </h3>
                    <div className="bg-zinc-950 border border-zinc-900 rounded-lg p-6">
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div>
                          <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">Revenue Growth</p>
                          <p className="text-xl font-light">
                            <YoYChange 
                              current={yearComparison.current.rawValues.revenue} 
                              previous={yearComparison.previous.rawValues.revenue}
                            />
                          </p>
                        </div>
                        <div>
                          <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">Net Income Growth</p>
                          <p className="text-xl font-light">
                            <YoYChange 
                              current={yearComparison.current.rawValues.netIncome} 
                              previous={yearComparison.previous.rawValues.netIncome}
                            />
                          </p>
                        </div>
                        <div>
                          <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">EPS Growth</p>
                          <p className="text-xl font-light">
                            <YoYChange 
                              current={yearComparison.current.perShare.eps} 
                              previous={yearComparison.previous.perShare.eps}
                            />
                          </p>
                        </div>
                        <div>
                          <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">FCF Growth</p>
                          <p className="text-xl font-light">
                            <YoYChange 
                              current={yearComparison.current.rawValues.freeCashFlow} 
                              previous={yearComparison.previous.rawValues.freeCashFlow}
                            />
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Charts Section */}
                {availableYears.length > 1 && (
                  <div className="mb-8">
                    <h3 className="text-xs font-medium text-gray-500 uppercase tracking-wider mb-6 pl-6">Multi-Year Trends</h3>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="bg-zinc-950 border border-zinc-900 rounded-lg p-6">
                        <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Revenue & Net Income (Billions)</h4>
                        <div className="h-64">
                          <canvas id="revenue-chart"></canvas>
                        </div>
                      </div>
                      
                      <div className="bg-zinc-950 border border-zinc-900 rounded-lg p-6">
                        <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Profit Margins (%)</h4>
                        <div className="h-64">
                          <canvas id="margins-chart"></canvas>
                        </div>
                      </div>
                      
                      <div className="bg-zinc-950 border border-zinc-900 rounded-lg p-6">
                        <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Cash Flow (Billions)</h4>
                        <div className="h-64">
                          <canvas id="cashflow-chart"></canvas>
                        </div>
                      </div>
                      
                      <div className="bg-zinc-950 border border-zinc-900 rounded-lg p-6">
                        <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Key Ratios Over Time</h4>
                        <div className="h-64">
                          <canvas id="ratios-chart"></canvas>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Summary */}
                <div className="bg-zinc-950 border border-zinc-900 rounded-lg p-6">
                  <h3 className="text-xs font-medium text-gray-500 uppercase tracking-wider mb-4">Analysis Summary</h3>
                  <div className="space-y-3 text-gray-400 font-light text-sm leading-relaxed">
                    <p>Revenue of {formatNumber(analysis.rawValues.revenue)} with {formatPercent(analysis.profitability.netMargin)} net margin</p>
                    <p>Profitability: ROE of {formatPercent(analysis.profitability.roe)}, ROA of {formatPercent(analysis.profitability.roa)}, and ROIC of {formatPercent(analysis.profitability.roic)}</p>
                    <p>Liquidity: Current ratio of {formatRatio(analysis.liquidity.currentRatio)} (ability to pay short-term obligations)</p>
                    <p>Leverage: Debt-to-Equity of {formatRatio(analysis.leverage.debtToEquity)} using interest-bearing debt only</p>
                    <p>Cash Generation: {formatNumber(analysis.rawValues.freeCashFlow)} in free cash flow ({formatPercent(analysis.cashFlow.fcfMargin)} FCF margin)</p>
                    <p>Efficiency: Asset turnover of {formatRatio(analysis.efficiency.assetTurnover)} (revenue generated per dollar of assets)</p>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<FinancialAnalyzer />);
  </script>
</body>
</html>
