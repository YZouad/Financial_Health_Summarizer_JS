<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEC Financial Analyzer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      width: 8px;
    }

    body::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    body::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px;
    }

    body::-webkit-scrollbar-thumb:hover {
      background: #333;
    }

    .section-divider {
      border-left: 1px solid #222;
      padding-left: 24px;
      transition: border-color 0.3s;
    }

    .section-divider:hover {
      border-left-color: #333;
    }

    .metric-card {
      background: rgba(10, 10, 10, 0.5);
      border: 1px solid #1a1a1a;
      transition: all 0.3s ease;
    }

    .metric-card:hover {
      border-color: #2a2a2a;
      background: rgba(15, 15, 15, 0.5);
    }

    .status-good { color: #10b981; }
    .status-neutral { color: #f59e0b; }
    .status-poor { color: #ef4444; }

    input:focus, select:focus, button:focus {
      outline: none;
      border-color: #444 !important;
    }

    .tab-button {
      position: relative;
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    .tab-button:hover {
      color: #9ca3af;
    }

    .tab-button.active {
      color: #fff;
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #fff;
    }

    .fair-value-card {
      background: rgba(10, 10, 10, 0.5);
      border: 1px solid #1a1a1a;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .fair-value-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .fair-value-card:hover::before {
      opacity: 1;
    }

    .fair-value-card:hover {
      border-color: #2a2a2a;
      background: rgba(15, 15, 15, 0.5);
    }

    .upside-positive {
      color: #10b981;
    }

    .upside-negative {
      color: #ef4444;
    }

    .formula-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function FinancialAnalyzer() {
    const [ticker, setTicker] = useState('');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [companyData, setCompanyData] = useState(null);
    const [availableYears, setAvailableYears] = useState([]);
    const [selectedYear, setSelectedYear] = useState('');
    const [analysis, setAnalysis] = useState(null);
    const [yearComparison, setYearComparison] = useState(null);
    const [showDataSources, setShowDataSources] = useState(false);
    const [valuations, setValuations] = useState(null);
    const [lboModel, setLboModel] = useState(null);
    const [fairValue, setFairValue] = useState(null);
    const [activeTab, setActiveTab] = useState('overview');
    const [debugInfo, setDebugInfo] = useState(null);
    
    const [currentStockPrice, setCurrentStockPrice] = useState('');
    
    const [showCredentialsModal, setShowCredentialsModal] = useState(true);
    const [userOrg, setUserOrg] = useState('');
    const [userEmail, setUserEmail] = useState('');
    const [credentialsSet, setCredentialsSet] = useState(false);
    const [userAgent, setUserAgent] = useState('');
    
    const chartsRef = useRef({});

    useEffect(() => {
        if (userAgent) {
        setCredentialsSet(true);
        setShowCredentialsModal(false);
        }
    }, [userAgent]);

    const handleSetCredentials = () => {
        if (!userOrg.trim() || !userEmail.trim()) {
        setError('Please provide both organization and email');
        return;
        }
        
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(userEmail)) {
        setError('Please provide a valid email address');
        return;
        }
        
        const ua = `${userOrg.trim()} ${userEmail.trim()}`;
        setUserAgent(ua);
        setCredentialsSet(true);
        setShowCredentialsModal(false);
        setError('');
    };

    const formatNumber = (num) => {
        if (num === null || num === undefined || isNaN(num)) return 'N/A';
        if (Math.abs(num) >= 1e9) return `$${(num / 1e9).toFixed(2)}B`;
        if (Math.abs(num) >= 1e6) return `$${(num / 1e6).toFixed(2)}M`;
        if (Math.abs(num) >= 1e3) return `$${(num / 1e3).toFixed(2)}K`;
        return `$${num.toFixed(2)}`;
    };

    const formatPercent = (num) => {
        if (num === null || num === undefined || isNaN(num)) return 'N/A';
        return `${num.toFixed(2)}%`;
    };

    const formatRatio = (num) => {
        if (num === null || num === undefined || isNaN(num)) return 'N/A';
        return num.toFixed(2);
    };

    const getCIKFromTicker = async (tickerSymbol) => {
        const apiUrl = 'http://localhost:3000/api/company-tickers';
        const response = await fetch(apiUrl, {
        headers: {
            'X-User-Agent': userAgent
        }
        });
        if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.message || 'Failed to fetch company list');
        }
        const data = await response.json();
        const company = Object.values(data).find(
        c => c.ticker && c.ticker.toLowerCase() === tickerSymbol.toLowerCase()
        );
        
        if (!company) {
          // Provide helpful error message
          throw new Error(`Ticker "${tickerSymbol}" not found in SEC database. This could mean:\n- The ticker symbol is incorrect\n- The company doesn't file with the SEC (foreign companies, private companies)\n- The company recently changed tickers\n- Try searching on sec.gov/edgar to verify the ticker`);
        }
        
        return String(company.cik_str).padStart(10, '0');
    };

      const getAvailableYears = (facts) => {
        const years = new Set();
        
        // Expanded list of revenue concepts to catch more companies
        const revenueConcepts = [
          'Revenues',
          'RevenueFromContractWithCustomerExcludingAssessedTax',
          'RevenueFromContractWithCustomerIncludingAssessedTax',
          'SalesRevenueNet',
          'SalesRevenueGoodsNet',
          'SalesRevenueServicesNet',
          'RegulatedAndUnregulatedOperatingRevenue',
          'OilAndGasRevenue',
          'InterestAndDividendIncomeOperating',
          'InterestIncomeOperating', // For financial institutions
          'TotalRevenues', // Sometimes used
          'Revenue' // Generic fallback
        ];
        
        for (const concept of revenueConcepts) {
          if (facts[concept] && facts[concept].units && facts[concept].units['USD']) {
            const data = facts[concept].units['USD'];
            data.forEach(item => {
              if (item.fy && (item.form === '10-K' || item.form === '10-K/A' || item.fp === 'FY')) {
                years.add(item.fy);
              }
            });
          }
        }
        
        // If no years found with standard revenue concepts, try to find ANY 10-K filings
        if (years.size === 0) {
          console.log('No revenue data found, checking for any 10-K filings...');
          // Try net income as a fallback
          const fallbackConcepts = ['NetIncomeLoss', 'ProfitLoss', 'Assets', 'StockholdersEquity'];
          for (const concept of fallbackConcepts) {
            if (facts[concept] && facts[concept].units) {
              const units = facts[concept].units['USD'] || facts[concept].units['shares'];
              if (units) {
                units.forEach(item => {
                  if (item.fy && (item.form === '10-K' || item.form === '10-K/A' || item.fp === 'FY')) {
                    years.add(item.fy);
                  }
                });
              }
            }
            if (years.size > 0) break;
          }
        }
        
        return Array.from(years).sort((a, b) => b - a);
      };

      const getValueForYear = (facts, concept, year, units = 'USD') => {
        if (!facts || !facts[concept]) return null;
        const unitData = facts[concept].units[units] || facts[concept].units['shares'];
        if (!unitData || !Array.isArray(unitData)) return null;
        
        const yearData = unitData.filter(item => 
          item.fy === year && 
          (item.form === '10-K' || item.form === '10-K/A' || item.fp === 'FY')
        );
        
        if (yearData.length === 0) return null;
        yearData.sort((a, b) => new Date(b.end) - new Date(a.end));
        return yearData[0];
      };

      const getValueWithFallback = (facts, concepts, year, units = 'USD') => {
        for (const concept of concepts) {
          const value = getValueForYear(facts, concept, year, units);
          if (value) {
            return { ...value, concept, confidence: 'high' };
          }
        }
        return { val: null, concept: 'none', confidence: 'none' };
      };

      const calculateFairValue = (metrics, historicalData) => {
        const eps = metrics.perShare.eps;
        const bookValuePerShare = metrics.perShare.bookValuePerShare;
        const shares = metrics.rawValues.shares;
        const equity = metrics.rawValues.stockholdersEquity;
        const netIncome = metrics.rawValues.netIncome;
        const dividends = metrics.rawValues.dividends;
        const currentAssets = metrics.rawValues.currentAssets;
        const totalLiabilities = metrics.rawValues.totalLiabilities;
        const totalAssets = metrics.rawValues.totalAssets;
        const operatingIncome = metrics.rawValues.operatingIncome;
        const totalDebt = metrics.rawValues.totalDebt;
        const cash = metrics.rawValues.cash;
        
        let epsGrowth = 0;
        let revenueGrowth = 0;
        let dividendGrowth = 0;
        
        if (historicalData.length >= 2) {
          const currentEPS = historicalData[0].perShare.eps;
          const oldestEPS = historicalData[historicalData.length - 1].perShare.eps;
          if (currentEPS && oldestEPS && oldestEPS !== 0) {
            epsGrowth = ((currentEPS - oldestEPS) / Math.abs(oldestEPS) / (historicalData.length - 1)) * 100;
          }
          
          const currentRev = historicalData[0].rawValues.revenue;
          const oldestRev = historicalData[historicalData.length - 1].rawValues.revenue;
          if (currentRev && oldestRev && oldestRev !== 0) {
            revenueGrowth = ((currentRev - oldestRev) / oldestRev / (historicalData.length - 1)) * 100;
          }
          
          const currentDiv = historicalData[0].rawValues.dividends;
          const oldestDiv = historicalData[historicalData.length - 1].rawValues.dividends;
          if (currentDiv && oldestDiv && oldestDiv > 0) {
            dividendGrowth = ((currentDiv - oldestDiv) / oldestDiv / (historicalData.length - 1)) * 100;
          }
        }
        
        const dividendYield = dividends > 0 && equity > 0 ? (dividends / equity) * 100 : 0;
        const dividendPerShare = shares > 0 && dividends > 0 ? dividends / shares : 0;
        
        const riskFreeRate = 0.04;
        const marketRiskPremium = 0.07;
        const beta = 1.2;
        const costOfEquity = riskFreeRate + (beta * marketRiskPremium);
        
        const marketValueEquity = equity;
        const marketValueDebt = totalDebt;
        const totalValue = marketValueEquity + marketValueDebt;
        const weightEquity = totalValue > 0 ? marketValueEquity / totalValue : 1;
        const weightDebt = totalValue > 0 ? marketValueDebt / totalValue : 0;
        const costOfDebt = 0.05;
        const taxRate = 0.21;
        const wacc = (weightEquity * costOfEquity) + (weightDebt * costOfDebt * (1 - taxRate));
        
        let lynchFairValue = null;
        if (eps && eps > 0 && (epsGrowth > 0 || revenueGrowth > 0)) {
          const growthRate = epsGrowth > 0 ? epsGrowth : revenueGrowth;
          lynchFairValue = eps * (Math.abs(growthRate) + dividendYield);
        }
        
        let grahamNumber = null;
        if (eps && eps > 0 && bookValuePerShare && bookValuePerShare > 0) {
          grahamNumber = Math.sqrt(22.5 * eps * bookValuePerShare);
        }
        
        let ddmValue = null;
        let ddmDetails = null;
        if (dividendPerShare > 0 && costOfEquity > (dividendGrowth / 100) && dividendGrowth > 0) {
          const g = dividendGrowth / 100;
          const D1 = dividendPerShare * (1 + g);
          ddmValue = D1 / (costOfEquity - g);
          ddmDetails = {
            currentDividend: dividendPerShare,
            nextYearDividend: D1,
            growthRate: dividendGrowth,
            requiredReturn: costOfEquity * 100,
            fairValue: ddmValue
          };
        }
        
        let epvValue = null;
        let epvDetails = null;
        if (operatingIncome > 0 && shares > 0) {
          const adjustedEarnings = operatingIncome * (1 - taxRate);
          const epv = adjustedEarnings / wacc;
          epvValue = epv / shares;
          epvDetails = {
            operatingIncome: operatingIncome,
            taxRate: taxRate * 100,
            adjustedEarnings: adjustedEarnings,
            wacc: wacc * 100,
            totalEPV: epv,
            perShare: epvValue
          };
        }
        
        let ncavValue = null;
        let ncavDetails = null;
        if (currentAssets > 0 && totalLiabilities > 0 && shares > 0) {
          const ncav = currentAssets - totalLiabilities;
          ncavValue = ncav / shares;
          ncavDetails = {
            currentAssets: currentAssets,
            totalLiabilities: totalLiabilities,
            netCurrentAssets: ncav,
            perShare: ncavValue,
            description: "Deep value metric: current assets minus ALL liabilities"
          };
        }
        
        let pegValue = null;
        let pegDetails = null;
        if (eps && eps > 0 && (epsGrowth > 0 || revenueGrowth > 0)) {
          const growthRate = epsGrowth > 0 ? epsGrowth : revenueGrowth;
          const fairPEG = 1.0;
          const fairPE = fairPEG * Math.abs(growthRate);
          pegValue = eps * fairPE;
          pegDetails = {
            eps: eps,
            growthRate: growthRate,
            fairPEG: fairPEG,
            impliedPE: fairPE,
            fairValue: pegValue
          };
        }
        
        let residualIncomeValue = null;
        let residualIncomeDetails = null;
        if (netIncome > 0 && equity > 0 && shares > 0) {
          const equityCharge = equity * costOfEquity;
          const residualIncome = netIncome - equityCharge;
          
          const projectionYears = 5;
          const fadeRate = 0.80;
          let pvResidualIncome = 0;
          
          for (let i = 1; i <= projectionYears; i++) {
            const projectedRI = residualIncome * Math.pow(fadeRate, i - 1);
            const pv = projectedRI / Math.pow(1 + costOfEquity, i);
            pvResidualIncome += pv;
          }
          
          const totalValue = equity + pvResidualIncome;
          residualIncomeValue = totalValue / shares;
          
          residualIncomeDetails = {
            bookValue: equity,
            bookValuePerShare: bookValuePerShare,
            netIncome: netIncome,
            equityCharge: equityCharge,
            residualIncome: residualIncome,
            pvResidualIncome: pvResidualIncome,
            totalValue: totalValue,
            perShare: residualIncomeValue,
            costOfEquity: costOfEquity * 100
          };
        }
        
        let peBasedValue = null;
        let peDetails = null;
        if (eps && eps > 0) {
          const industryPE = 15;
          let justifiedPE = industryPE;
          
          if (dividendPerShare > 0 && dividends > 0 && netIncome > 0) {
            const payoutRatio = dividends / netIncome;
            const g = dividendGrowth > 0 ? dividendGrowth / 100 : 0.05;
            if (costOfEquity > g) {
              justifiedPE = payoutRatio * (1 + g) / (costOfEquity - g);
            }
          }
          
          peBasedValue = eps * justifiedPE;
          peDetails = {
            eps: eps,
            industryPE: industryPE,
            justifiedPE: justifiedPE,
            fairValue: peBasedValue,
            method: dividendPerShare > 0 ? "DDM-derived P/E" : "Industry Average P/E"
          };
        }
        
        let tangibleBookValue = null;
        if (totalAssets > 0 && totalLiabilities > 0 && shares > 0) {
          const estimatedIntangibles = totalAssets * 0.10;
          const tangibleAssets = totalAssets - estimatedIntangibles;
          const tangibleEquity = tangibleAssets - totalLiabilities;
          tangibleBookValue = tangibleEquity / shares;
        }
        
        return {
          lynch: {
            fairValue: lynchFairValue,
            eps,
            growthRate: epsGrowth > 0 ? epsGrowth : revenueGrowth,
            dividendYield,
            applicable: lynchFairValue !== null && lynchFairValue > 0,
            formula: "EPS × (Growth Rate + Dividend Yield)"
          },
          graham: {
            number: grahamNumber,
            eps,
            bookValuePerShare,
            applicable: grahamNumber !== null && grahamNumber > 0,
            formula: "√(22.5 × EPS × Book Value Per Share)"
          },
          ddm: ddmDetails ? {
            ...ddmDetails,
            applicable: true,
            formula: "D₁ / (r - g)"
          } : {
            applicable: false,
            reason: "Requires positive dividends and positive dividend growth"
          },
          epv: epvDetails ? {
            ...epvDetails,
            applicable: true,
            formula: "Adjusted Operating Income / WACC"
          } : {
            applicable: false,
            reason: "Requires positive operating income"
          },
          ncav: ncavDetails ? {
            ...ncavDetails,
            applicable: true,
            formula: "(Current Assets - Total Liabilities) / Shares"
          } : {
            applicable: false,
            reason: "Requires positive net current assets"
          },
          peg: pegDetails ? {
            ...pegDetails,
            applicable: true,
            formula: "EPS × (PEG × Growth Rate), where PEG = 1.0"
          } : {
            applicable: false,
            reason: "Requires positive EPS and growth"
          },
          residualIncome: residualIncomeDetails ? {
            ...residualIncomeDetails,
            applicable: true,
            formula: "Book Value + PV(Residual Incomes)"
          } : {
            applicable: false,
            reason: "Requires positive net income and equity"
          },
          peBased: peDetails ? {
            ...peDetails,
            applicable: true,
            formula: "EPS × Justified P/E"
          } : {
            applicable: false,
            reason: "Requires positive EPS"
          },
          tangibleBook: {
            value: tangibleBookValue,
            applicable: tangibleBookValue !== null && tangibleBookValue > 0,
            formula: "(Tangible Assets - Liabilities) / Shares"
          },
          assumptions: {
            riskFreeRate: riskFreeRate * 100,
            marketRiskPremium: marketRiskPremium * 100,
            beta: beta,
            costOfEquity: costOfEquity * 100,
            costOfDebt: costOfDebt * 100,
            wacc: wacc * 100,
            taxRate: taxRate * 100
          }
        };
      };

      const calculateValuations = (facts, years) => {
        const currentYear = years[0];
        const metrics = calculateMetricsForYear(facts, currentYear);
        
        const historicalData = years.slice(0, 5).map(year => calculateMetricsForYear(facts, year));
        
        const isProfitable = metrics.rawValues.netIncome > 0;
        const hasPositiveFCF = metrics.rawValues.freeCashFlow > 0;
        const hasPositiveEBITDA = (metrics.rawValues.operatingIncome + (metrics.rawValues.revenue * 0.05)) > 0;
        
        const revenueGrowth = historicalData.length > 1 ? 
          ((historicalData[0].rawValues.revenue - historicalData[historicalData.length-1].rawValues.revenue) / 
          historicalData[historicalData.length-1].rawValues.revenue / (historicalData.length - 1)) * 100 : 5;
        
        const fcfGrowth = historicalData.length > 1 && hasPositiveFCF ? 
          ((historicalData[0].rawValues.freeCashFlow - historicalData[historicalData.length-1].rawValues.freeCashFlow) / 
          Math.abs(historicalData[historicalData.length-1].rawValues.freeCashFlow) / (historicalData.length - 1)) * 100 : 5;
        
        const bookValue = metrics.rawValues.stockholdersEquity;
        const bookValuePerShare = metrics.rawValues.shares > 0 ? metrics.perShare.bookValuePerShare : null;
        
        const adjustedNetAsset = bookValue > 0 ? bookValue * 1.2 : bookValue;
        const adjustedNetAssetPerShare = bookValuePerShare && bookValuePerShare > 0 ? bookValuePerShare * 1.2 : bookValuePerShare;
        
        let dcfValuation = null;
        if (hasPositiveFCF || (metrics.rawValues.revenue > 0 && revenueGrowth > 10)) {
          const wacc = 0.10;
          const terminalGrowthRate = 0.025;
          const projectionYears = 5;
          
          const projectedFCF = [];
          let currentFCF = hasPositiveFCF ? metrics.rawValues.freeCashFlow : metrics.rawValues.revenue * 0.1;
          const projectedGrowthRate = Math.min(Math.max(hasPositiveFCF ? fcfGrowth / 100 : 0.20, 0.05), 0.30);
          
          for (let i = 1; i <= projectionYears; i++) {
            currentFCF = currentFCF * (1 + projectedGrowthRate);
            projectedFCF.push(currentFCF);
          }
          
          let pvFCF = 0;
          projectedFCF.forEach((fcf, i) => {
            pvFCF += fcf / Math.pow(1 + wacc, i + 1);
          });
          
          const terminalFCF = projectedFCF[projectedFCF.length - 1] * (1 + terminalGrowthRate);
          const terminalValue = terminalFCF / (wacc - terminalGrowthRate);
          const pvTerminalValue = terminalValue / Math.pow(1 + wacc, projectionYears);
          
          const enterpriseValueDCF = pvFCF + pvTerminalValue;
          const equityValueDCF = enterpriseValueDCF - metrics.rawValues.totalDebt + metrics.rawValues.cash;
          const equityValuePerShareDCF = metrics.rawValues.shares > 0 ? equityValueDCF / metrics.rawValues.shares : null;
          
          dcfValuation = {
            enterpriseValue: enterpriseValueDCF,
            equityValue: equityValueDCF,
            perShare: equityValuePerShareDCF,
            wacc: wacc * 100,
            terminalGrowth: terminalGrowthRate * 100,
            projectedFCF,
            pvFCF,
            terminalValue,
            pvTerminalValue,
            description: hasPositiveFCF ? "Discounted cash flow valuation" : "DCF with projected positive FCF",
            isProjected: !hasPositiveFCF
          };
        }
        
        const revenueMultipleValuation = {
          applicable: !isProfitable && metrics.rawValues.revenue > 0,
          description: "Revenue-based valuation for growth companies"
        };
        
        if (revenueMultipleValuation.applicable) {
          let assumedRevenueMultiple = 3.0;
          
          if (revenueGrowth > 50) assumedRevenueMultiple = 8.0;
          else if (revenueGrowth > 30) assumedRevenueMultiple = 6.0;
          else if (revenueGrowth > 15) assumedRevenueMultiple = 4.0;
          
          const enterpriseValue = metrics.rawValues.revenue * assumedRevenueMultiple;
          const equityValue = enterpriseValue - metrics.rawValues.totalDebt + metrics.rawValues.cash;
          
          revenueMultipleValuation.multiple = assumedRevenueMultiple;
          revenueMultipleValuation.enterpriseValue = enterpriseValue;
          revenueMultipleValuation.equityValue = equityValue;
          revenueMultipleValuation.perShare = metrics.rawValues.shares > 0 ? equityValue / metrics.rawValues.shares : null;
          revenueMultipleValuation.revenueGrowth = revenueGrowth;
        }
        
        const dividendYield = metrics.rawValues.dividends > 0 && metrics.rawValues.stockholdersEquity > 0 ?
          (metrics.rawValues.dividends / metrics.rawValues.stockholdersEquity) : 0;
        const assumedDividendGrowth = 0.05;
        const costOfEquity = 0.12;
        
        let ddmValue = null;
        if (dividendYield > 0 && costOfEquity > assumedDividendGrowth && isProfitable) {
          const currentDividendPerShare = metrics.rawValues.shares > 0 ? 
            metrics.rawValues.dividends / metrics.rawValues.shares : 0;
          ddmValue = (currentDividendPerShare * (1 + assumedDividendGrowth)) / (costOfEquity - assumedDividendGrowth);
        }
        
        let excessEarningsValuation = null;
        if (isProfitable) {
          const normalReturnOnAssets = 0.08;
          const normalEarnings = metrics.rawValues.totalAssets * normalReturnOnAssets;
          const excessEarnings = metrics.rawValues.netIncome - normalEarnings;
          const intangibleCapRate = 0.15;
          const intangibleValue = excessEarnings > 0 ? excessEarnings / intangibleCapRate : 0;
          const excessEarningsValue = metrics.rawValues.totalAssets + intangibleValue;
          
          excessEarningsValuation = {
            total: excessEarningsValue,
            tangibleValue: metrics.rawValues.totalAssets,
            intangibleValue: intangibleValue,
            excessEarnings: excessEarnings,
            description: "Value based on excess earnings over normal returns"
          };
        }
        
        let comparablesValuation = null;
        if (isProfitable) {
          const assumedPEMultiple = 15;
          const assumedEVToEBITDA = 10;
          const ebitda = metrics.rawValues.operatingIncome + (metrics.rawValues.revenue * 0.05);
          
          const peValuation = metrics.rawValues.netIncome * assumedPEMultiple;
          const evToEbitdaValuation = hasPositiveEBITDA ? 
            (ebitda * assumedEVToEBITDA) - metrics.rawValues.totalDebt + metrics.rawValues.cash : null;
          
          comparablesValuation = {
            peValuation,
            evToEbitdaValuation,
            assumedPE: assumedPEMultiple,
            assumedEVToEBITDA: assumedEVToEBITDA,
            description: "Valuation using industry multiples",
            applicable: hasPositiveEBITDA
          };
        }
        
        const validEquityValues = [];
        const validPerShareValues = [];
        
        if (dcfValuation && dcfValuation.equityValue > 0) {
          validEquityValues.push(dcfValuation.equityValue);
          if (dcfValuation.perShare) validPerShareValues.push(dcfValuation.perShare);
        }
        
        if (adjustedNetAsset > 0) {
          validEquityValues.push(adjustedNetAsset);
          if (adjustedNetAssetPerShare) validPerShareValues.push(adjustedNetAssetPerShare);
        }
        
        if (revenueMultipleValuation.applicable && revenueMultipleValuation.equityValue > 0) {
          validEquityValues.push(revenueMultipleValuation.equityValue);
          if (revenueMultipleValuation.perShare) validPerShareValues.push(revenueMultipleValuation.perShare);
        }
        
        if (comparablesValuation) {
          if (comparablesValuation.peValuation > 0) {
            validEquityValues.push(comparablesValuation.peValuation);
            if (metrics.rawValues.shares > 0) validPerShareValues.push(comparablesValuation.peValuation / metrics.rawValues.shares);
          }
          if (comparablesValuation.evToEbitdaValuation && comparablesValuation.evToEbitdaValuation > 0) {
            validEquityValues.push(comparablesValuation.evToEbitdaValuation);
            if (metrics.rawValues.shares > 0) validPerShareValues.push(comparablesValuation.evToEbitdaValuation / metrics.rawValues.shares);
          }
        }
        
        const averageEquityValue = validEquityValues.length > 0 ? 
          validEquityValues.reduce((a, b) => a + b, 0) / validEquityValues.length : null;
        const averagePerShare = validPerShareValues.length > 0 ? 
          validPerShareValues.reduce((a, b) => a + b, 0) / validPerShareValues.length : null;
        
        return {
          companyStage: {
            isProfitable,
            hasPositiveFCF,
            hasPositiveEBITDA,
            revenueGrowth,
            stage: !isProfitable && revenueGrowth > 20 ? "High-Growth Unprofitable" : 
                   !isProfitable ? "Early-Stage/Turnaround" : "Mature/Profitable"
          },
          bookValue: {
            total: bookValue,
            perShare: bookValuePerShare,
            description: "Net asset value from balance sheet",
            applicable: true
          },
          adjustedNetAsset: {
            total: adjustedNetAsset,
            perShare: adjustedNetAssetPerShare,
            description: "Book value adjusted for fair market value (20% premium)",
            applicable: true
          },
          dcf: dcfValuation,
          revenueMultiple: revenueMultipleValuation,
          ddm: ddmValue ? {
            perShare: ddmValue,
            dividendYield: dividendYield * 100,
            applicable: true,
            description: "Dividend discount model (Gordon Growth)"
          } : null,
          excessEarnings: excessEarningsValuation,
          comparables: comparablesValuation,
          summary: {
            averageEquityValue,
            averagePerShare,
            validationCount: validEquityValues.length,
            warning: validEquityValues.length < 2 ? "Limited valuation methods applicable - company may be early-stage or distressed" : null
          }
        };
      };
      
      const calculateLBO = (facts, years) => {
        const currentYear = years[0];
        const metrics = calculateMetricsForYear(facts, currentYear);
        
        const ebitda = metrics.rawValues.operatingIncome + (metrics.rawValues.revenue * 0.05);
        
        if (ebitda <= 0) {
          return {
            applicable: false,
            reason: "LBO model not applicable: Company has negative EBITDA",
            ebitda: ebitda,
            suggestion: "LBO transactions typically require positive EBITDA and stable cash flows. Consider waiting until the company reaches profitability or use alternative financing structures."
          };
        }
        
        if (metrics.rawValues.freeCashFlow < 0) {
          return {
            applicable: false,
            reason: "LBO model not recommended: Company has negative free cash flow",
            fcf: metrics.rawValues.freeCashFlow,
            ebitda: ebitda,
            suggestion: "While the company has positive EBITDA, negative FCF makes debt servicing challenging. An LBO would require significant operational improvements or be highly risky."
          };
        }
        
        const purchaseMultiple = 8.0;
        const exitMultiple = 9.0;
        const debtMultiple = 5.0;
        const equityContribution = 0.40;
        const interestRate = 0.065;
        const holdingPeriod = 5;
        
        const purchasePrice = ebitda * purchaseMultiple;
        const debtFinancing = Math.min(ebitda * debtMultiple, purchasePrice * (1 - equityContribution));
        const equityInvestment = purchasePrice - debtFinancing;
        
        const projections = [];
        let remainingDebt = debtFinancing;
        const growthRate = 0.05;
        
        for (let year = 1; year <= holdingPeriod; year++) {
          const yearRevenue = metrics.rawValues.revenue * Math.pow(1 + growthRate, year);
          const yearEBITDA = yearRevenue * (ebitda / metrics.rawValues.revenue);
          const yearFCF = Math.max(metrics.rawValues.freeCashFlow * Math.pow(1 + growthRate, year), yearEBITDA * 0.5);
          
          const interestExpense = remainingDebt * interestRate;
          const principalPayment = Math.max(0, yearFCF - interestExpense);
          remainingDebt = Math.max(0, remainingDebt - principalPayment);
          
          projections.push({
            year,
            revenue: yearRevenue,
            ebitda: yearEBITDA,
            fcf: yearFCF,
            interestExpense,
            principalPayment,
            debtBalance: remainingDebt
          });
        }
        
        const exitEBITDA = projections[projections.length - 1].ebitda;
        const exitEnterpriseValue = exitEBITDA * exitMultiple;
        const exitDebt = projections[projections.length - 1].debtBalance;
        const exitEquityValue = exitEnterpriseValue - exitDebt;
        
        const moic = exitEquityValue / equityInvestment;
        const irr = (Math.pow(moic, 1 / holdingPeriod) - 1) * 100;
        
        return {
          applicable: true,
          assumptions: {
            purchaseMultiple,
            exitMultiple,
            debtMultiple,
            equityContribution: equityContribution * 100,
            interestRate: interestRate * 100,
            holdingPeriod,
            revenueGrowth: growthRate * 100
          },
          entry: {
            ebitda,
            purchasePrice,
            debtFinancing,
            equityInvestment,
            debtToEquity: debtFinancing / equityInvestment
          },
          projections,
          exit: {
            ebitda: exitEBITDA,
            enterpriseValue: exitEnterpriseValue,
            debt: exitDebt,
            equityValue: exitEquityValue
          },
          returns: {
            moic,
            irr,
            totalReturn: exitEquityValue - equityInvestment,
            returnMultiple: exitEquityValue / equityInvestment
          }
        };
      };

      const calculateMetricsForYear = (facts, year) => {
        const dataSources = {};
        
        // EXPANDED revenue concepts
        const revenue = getValueWithFallback(facts, [
          'Revenues',
          'RevenueFromContractWithCustomerExcludingAssessedTax',
          'SalesRevenueNet',
          'RevenueFromContractWithCustomerIncludingAssessedTax',

          'TotalRevenues',
          'Revenue'
        ], year);
        dataSources.revenue = revenue.concept;
        
        const costOfRevenue = getValueWithFallback(facts, [
          'CostOfRevenue',
          'CostOfGoodsAndServicesSold',
          'CostOfGoodsSold',
          'CostOfSales'
        ], year);
        dataSources.costOfRevenue = costOfRevenue.concept;
        
        const grossProfit = getValueWithFallback(facts, ['GrossProfit'], year);
        dataSources.grossProfit = grossProfit.concept;
        
        const operatingIncome = getValueWithFallback(facts, [
          'OperatingIncomeLoss',
          'IncomeLossFromOperations',
          'IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments'
        ], year);
        dataSources.operatingIncome = operatingIncome.concept;
        
        const netIncome = getValueWithFallback(facts, [
          'NetIncomeLoss',
          'ProfitLoss',
          'NetIncomeLossAvailableToCommonStockholdersBasic'
        ], year);
        dataSources.netIncome = netIncome.concept;
        
        const operatingExpenses = getValueWithFallback(facts, [
          'OperatingExpenses',
          'CostsAndExpenses'
        ], year);
        
        const researchDevelopment = getValueWithFallback(facts, [
          'ResearchAndDevelopmentExpense'
        ], year);
        
        const sellingGeneralAdmin = getValueWithFallback(facts, [
          'SellingGeneralAndAdministrativeExpense'
        ], year);
        
        const interestExpense = getValueWithFallback(facts, [
          'InterestExpense',
          'InterestExpenseDebt'
        ], year);
        
        const taxExpense = getValueWithFallback(facts, [
          'IncomeTaxExpenseBenefit',
          'IncomeTaxesPaid'
        ], year);
        
        const totalAssets = getValueWithFallback(facts, ['Assets'], year);
        dataSources.totalAssets = totalAssets.concept;
        
        const currentAssets = getValueWithFallback(facts, ['AssetsCurrent'], year);
        dataSources.currentAssets = currentAssets.concept;
        
        const cash = getValueWithFallback(facts, [
          'CashAndCashEquivalentsAtCarryingValue',
          'Cash',
          'CashCashEquivalentsAndShortTermInvestments'
        ], year);
        
        const inventories = getValueWithFallback(facts, [
          'InventoryNet',
          'Inventory'
        ], year);
        
        const accountsReceivable = getValueWithFallback(facts, [
          'AccountsReceivableNetCurrent',
          'AccountsReceivableNet'
        ], year);
        
        const totalLiabilities = getValueWithFallback(facts, ['Liabilities'], year);
        dataSources.totalLiabilities = totalLiabilities.concept;
        
        const currentLiabilities = getValueWithFallback(facts, ['LiabilitiesCurrent'], year);
        dataSources.currentLiabilities = currentLiabilities.concept;
        
        const longTermDebt = getValueWithFallback(facts, [
          'LongTermDebt',
          'LongTermDebtNoncurrent',
          'LongTermDebtAndCapitalLeaseObligations'
        ], year);
        dataSources.longTermDebt = longTermDebt.concept;
        
        const shortTermDebt = getValueWithFallback(facts, [
          'DebtCurrent',
          'ShortTermBorrowings',
          'CommercialPaper'
        ], year);
        dataSources.shortTermDebt = shortTermDebt.concept;
        
        const totalDebt = (longTermDebt?.val || 0) + (shortTermDebt?.val || 0);
        
        const stockholdersEquity = getValueWithFallback(facts, [
          'StockholdersEquity',
          'ShareholdersEquity'
        ], year);
        dataSources.stockholdersEquity = stockholdersEquity.concept;
        
        const operatingCashFlow = getValueWithFallback(facts, [
          'NetCashProvidedByUsedInOperatingActivities'
        ], year);
        dataSources.operatingCashFlow = operatingCashFlow.concept;
        
        const investingCashFlow = getValueWithFallback(facts, [
          'NetCashProvidedByUsedInInvestingActivities'
        ], year);
        
        const financingCashFlow = getValueWithFallback(facts, [
          'NetCashProvidedByUsedInFinancingActivities'
        ], year);
        
        const capex = getValueWithFallback(facts, [
          'PaymentsToAcquirePropertyPlantAndEquipment',
          'CapitalExpenditures'
        ], year);
        dataSources.capex = capex.concept;
        
        const dividendsPaid = getValueWithFallback(facts, [
          'PaymentsOfDividends',
          'DividendsPaid'
        ], year);
        
        const commonShares = getValueWithFallback(facts, [
          'CommonStockSharesOutstanding',
          'SharesOutstanding',
          'WeightedAverageNumberOfSharesOutstandingBasic'
        ], year, 'shares');
        dataSources.shares = commonShares.concept;
        
        const revenueVal = revenue?.val || 0;
        const costOfRevenueVal = costOfRevenue?.val || 0;
        
        let grossProfitVal = grossProfit?.val;
        let grossProfitCalculated = false;
        if (!grossProfitVal && revenueVal && costOfRevenueVal) {
          grossProfitVal = revenueVal - costOfRevenueVal;
          grossProfitCalculated = true;
        }
        
        const operatingIncomeVal = operatingIncome?.val || 0;
        const netIncomeVal = netIncome?.val || 0;
        const interestExpenseVal = interestExpense?.val || 0;
        const taxExpenseVal = taxExpense?.val || 0;
        
        let ebitVal = netIncomeVal + interestExpenseVal + taxExpenseVal;
        
        const totalAssetsVal = totalAssets?.val || 0;
        const currentAssetsVal = currentAssets?.val || 0;
        const cashVal = cash?.val || 0;
        const inventoriesVal = inventories?.val || 0;
        const accountsReceivableVal = accountsReceivable?.val || 0;
        
        const totalLiabilitiesVal = totalLiabilities?.val || 0;
        const currentLiabilitiesVal = currentLiabilities?.val || 0;
        const longTermDebtVal = longTermDebt?.val || 0;
        const shortTermDebtVal = shortTermDebt?.val || 0;
        const totalDebtVal = totalDebt;
        
        const equityVal = stockholdersEquity?.val || 0;
        
        const ocfVal = operatingCashFlow?.val || 0;
        const investingCfVal = investingCashFlow?.val || 0;
        const financingCfVal = financingCashFlow?.val || 0;
        const capexVal = Math.abs(capex?.val || 0);
        const dividendsVal = Math.abs(dividendsPaid?.val || 0);
        
        const sharesVal = commonShares?.val || 0;

        const grossMargin = revenueVal !== 0 && grossProfitVal ? (grossProfitVal / revenueVal) * 100 : null;
        const operatingMargin = revenueVal !== 0 ? (operatingIncomeVal / revenueVal) * 100 : null;
        const netMargin = revenueVal !== 0 ? (netIncomeVal / revenueVal) * 100 : null;
        const roe = equityVal !== 0 ? (netIncomeVal / equityVal) * 100 : null;
        const roa = totalAssetsVal !== 0 ? (netIncomeVal / totalAssetsVal) * 100 : null;
        
        const taxRate = (netIncomeVal + taxExpenseVal) !== 0 ? taxExpenseVal / (netIncomeVal + taxExpenseVal) : 0.21;
        const nopat = operatingIncomeVal * (1 - taxRate);
        const investedCapital = totalDebtVal + equityVal;
        const roic = investedCapital !== 0 ? (nopat / investedCapital) * 100 : null;
        
        const currentRatio = currentLiabilitiesVal !== 0 ? currentAssetsVal / currentLiabilitiesVal : null;
        const quickRatio = currentLiabilitiesVal !== 0 ? (currentAssetsVal - inventoriesVal) / currentLiabilitiesVal : null;
        const cashRatio = currentLiabilitiesVal !== 0 ? cashVal / currentLiabilitiesVal : null;
        
        const debtToEquity = equityVal !== 0 ? totalDebtVal / equityVal : null;
        const debtToAssets = totalAssetsVal !== 0 ? totalDebtVal / totalAssetsVal : null;
        const equityMultiplier = equityVal !== 0 ? totalAssetsVal / equityVal : null;
        const interestCoverage = interestExpenseVal !== 0 && ebitVal ? ebitVal / interestExpenseVal : null;
        
        const assetTurnover = totalAssetsVal !== 0 ? revenueVal / totalAssetsVal : null;
        const inventoryTurnover = inventoriesVal !== 0 ? costOfRevenueVal / inventoriesVal : null;
        const receivablesTurnover = accountsReceivableVal !== 0 ? revenueVal / accountsReceivableVal : null;
        const daysSalesOutstanding = receivablesTurnover !== 0 && receivablesTurnover ? 365 / receivablesTurnover : null;
        const daysInventoryOutstanding = inventoryTurnover !== 0 && inventoryTurnover ? 365 / inventoryTurnover : null;
        
        const freeCashFlow = ocfVal - capexVal;
        const fcfMargin = revenueVal !== 0 ? (freeCashFlow / revenueVal) * 100 : null;
        const ocfToNetIncome = netIncomeVal !== 0 ? ocfVal / netIncomeVal : null;
        const cashFlowToDebt = totalDebtVal !== 0 ? ocfVal / totalDebtVal : null;
        
        const eps = sharesVal !== 0 ? netIncomeVal / sharesVal : null;
        const bookValuePerShare = sharesVal !== 0 ? equityVal / sharesVal : null;
        const cashPerShare = sharesVal !== 0 ? cashVal / sharesVal : null;
        const fcfPerShare = sharesVal !== 0 ? freeCashFlow / sharesVal : null;

        const dataQuality = {
          score: 0,
          total: 0,
          details: {}
        };
        
        const checkDataQuality = (name, hasValue, isCalculated = false) => {
          dataQuality.total++;
          if (hasValue) {
            dataQuality.score++;
            dataQuality.details[name] = isCalculated ? 'calculated' : 'reported';
          } else {
            dataQuality.details[name] = 'missing';
          }
        };
        
        checkDataQuality('revenue', revenueVal);
        checkDataQuality('netIncome', netIncomeVal);
        checkDataQuality('totalAssets', totalAssetsVal);
        checkDataQuality('stockholdersEquity', equityVal);
        checkDataQuality('operatingCashFlow', ocfVal);
        checkDataQuality('grossProfit', grossProfitVal, grossProfitCalculated);
        checkDataQuality('operatingIncome', operatingIncomeVal);
        checkDataQuality('debt', totalDebtVal > 0);

        return {
          periodEnd: revenue?.end || netIncome?.end || 'N/A',
          fiscalYear: year,
          dataSources,
          dataQuality: {
            ...dataQuality,
            percentage: (dataQuality.score / dataQuality.total * 100).toFixed(0)
          },
          rawValues: {
            revenue: revenueVal,
            costOfRevenue: costOfRevenueVal,
            grossProfit: grossProfitVal,
            operatingIncome: operatingIncomeVal,
            netIncome: netIncomeVal,
            ebit: ebitVal,
            totalAssets: totalAssetsVal,
            currentAssets: currentAssetsVal,
            cash: cashVal,
            inventories: inventoriesVal,
            accountsReceivable: accountsReceivableVal,
            totalLiabilities: totalLiabilitiesVal,
            currentLiabilities: currentLiabilitiesVal,
            longTermDebt: longTermDebtVal,
            shortTermDebt: shortTermDebtVal,
            totalDebt: totalDebtVal,
            stockholdersEquity: equityVal,
            operatingCashFlow: ocfVal,
            freeCashFlow: freeCashFlow,
            capex: capexVal,
            dividends: dividendsVal,
            shares: sharesVal
          },
          profitability: {
            grossMargin,
            operatingMargin,
            netMargin,
            roe,
            roa,
            roic
          },
          liquidity: {
            currentRatio,
            quickRatio,
            cashRatio
          },
          leverage: {
            debtToEquity,
            debtToAssets,
            equityMultiplier,
            interestCoverage
          },
          efficiency: {
            assetTurnover,
            inventoryTurnover,
            receivablesTurnover,
            daysSalesOutstanding,
            daysInventoryOutstanding
          },
          cashFlow: {
            freeCashFlow,
            fcfMargin,
            ocfToNetIncome,
            cashFlowToDebt
          },
          perShare: {
            eps,
            bookValuePerShare,
            cashPerShare,
            fcfPerShare
          },
          notes: {
            grossProfitCalculated,
            debtDefinition: 'Interest-bearing debt only (excludes accounts payable, accrued expenses, etc.)'
          }
        };
      };

      const analyzeCompany = async () => {

            previous: prevYearMetrics
          });

        if (value >= thresholds.good) return 'good';
        if (value >= thresholds.neutral) return 'neutral';
        return 'poor';
      };

      const getHealthStatusInverse = (value, thresholds) => {
        if (value === null || value === undefined || isNaN(value)) return 'neutral';
        if (value <= thresholds.good) return 'good';
        if (value <= thresholds.neutral) return 'neutral';
        return 'poor';

                                      ((fairValue.peBased.fairValue - parseFloat(currentStockPrice)) / parseFloat(currentStockPrice) * 100) > 0 
                                        ? 'upside-positive' 
                                        : 'upside-negative'
                                    }`}>
                                      {((fairValue.peBased.fairValue - parseFloat(currentStockPrice)) / parseFloat(currentStockPrice) * 100).toFixed(1)}%
                                    </p>
                                  </div>
                                )}
                              </div>

                              <div className="border-t border-zinc-800 pt-4">
                                <div className="grid grid-cols-2 gap-4 text-sm">
                                  <div>
                                    <span className="text-gray-500">EPS:</span>
                                    <span className="text-white ml-2">${formatRatio(fairValue.peBased.eps)}</span>
                                  </div>
                                  <div>
                                    <span className="text-gray-500">Justified P/E:</span>
                                    <span className="text-white ml-2">{formatRatio(fairValue.peBased.justifiedPE)}</span>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </FairValueCard>
                        ) : (
                          <div className="fair-value-card rounded-lg p-6 border-zinc-800">
                            <h4 className="text-lg font-light text-gray-400 mb-2">P/E Based Fair Value - Not Applicable</h4>
                            <p className="text-sm text-gray-400 font-light">
                              {fairValue.peBased.reason}
                            </p>
                          </div>
                        )}

                        {/* Tangible Book Value */}
                        {fairValue.tangibleBook.applicable ? (
                          <FairValueCard title="Tangible Book Value" method="Asset-Based Valuation">
                            <div className="space-y-4">
                              <div className="formula-box">
                                <div className="mb-2 text-gray-500 text-xs uppercase tracking-wider">Formula:</div>
                                <div>{fairValue.tangibleBook.formula}</div>
                              </div>
                              
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                  <p className="text-xs text-gray-500 uppercase tracking-wider mb-2">Tangible Book Value/Share</p>
                                  <p className="text-4xl font-light text-white">{formatNumber(fairValue.tangibleBook.value)}</p>
                                </div>
                                {currentStockPrice && fairValue.tangibleBook.value && (
                                  <div>
                                    <p className="text-xs text-gray-500 uppercase tracking-wider mb-2">Upside / Downside</p>
                                    <p className={`text-4xl font-light ${
                                      ((fairValue.tangibleBook.value - parseFloat(currentStockPrice)) / parseFloat(currentStockPrice) * 100) > 0 
                                        ? 'upside-positive' 
                                        : 'upside-negative'
                                    }`}>
                                      {((fairValue.tangibleBook.value - parseFloat(currentStockPrice)) / parseFloat(currentStockPrice) * 100).toFixed(1)}%
                                    </p>
                                  </div>
                                )}
                              </div>
                            </div>
                          </FairValueCard>
                        ) : (
                          <div className="fair-value-card rounded-lg p-6 border-zinc-800">
                            <h4 className="text-lg font-light text-gray-400 mb-2">Tangible Book Value - Not Applicable</h4>
                            <p className="text-sm text-gray-400 font-light">
                              Requires positive tangible equity.
                            </p>
                          </div>
                        )}
                      </div>
                    )}

                    {activeTab === 'valuations' && valuations && (
                      <div className="space-y-8">
                        <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                          <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Company Profile</h4>
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                            <div>
                              <span className="text-gray-600">Stage:</span>
                              <span className={`ml-2 font-medium ${
                                valuations.companyStage.stage.includes('High-Growth') ? 'text-blue-400' :
                                valuations.companyStage.stage.includes('Early-Stage') ? 'text-yellow-400' : 'text-green-400'
                              }`}>
                                {valuations.companyStage.stage}
                              </span>
                            </div>
                            <div>
                              <span className="text-gray-600">Profitable:</span>
                              <span className={`ml-2 ${valuations.companyStage.isProfitable ? 'text-green-400' : 'text-red-400'}`}>
                                {valuations.companyStage.isProfitable ? 'Yes' : 'No'}
                              </span>
                            </div>
                            <div>
                              <span className="text-gray-600">Positive FCF:</span>
                              <span className={`ml-2 ${valuations.companyStage.hasPositiveFCF ? 'text-green-400' : 'text-red-400'}`}>
                                {valuations.companyStage.hasPositiveFCF ? 'Yes' : 'No'}
                              </span>
                            </div>
                            <div>
                              <span className="text-gray-600">Revenue Growth:</span>
                              <span className={`ml-2 ${valuations.companyStage.revenueGrowth > 20 ? 'text-green-400' : 'text-gray-400'}`}>
                                {formatPercent(valuations.companyStage.revenueGrowth)}
                              </span>
                            </div>
                          </div>
                        </div>
                        
                        {valuations.summary.averageEquityValue && (
                          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                            <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Valuation Summary</h4>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                              <div>
                                <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">Average Equity Value</p>
                                <p className="text-3xl font-light text-white">{formatNumber(valuations.summary.averageEquityValue)}</p>
                                <p className="text-xs text-gray-600 mt-1">Based on {valuations.summary.validationCount} applicable methods</p>
                              </div>
                              <div>
                                <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">Average Per Share Value</p>
                                <p className="text-3xl font-light text-white">{valuations.summary.averagePerShare ? formatNumber(valuations.summary.averagePerShare) : 'N/A'}</p>
                              </div>
                            </div>
                            {valuations.summary.warning && (
                              <div className="mt-4 p-3 bg-yellow-950 border border-yellow-900 rounded">
                                <p className="text-sm text-yellow-400 font-light">{valuations.summary.warning}</p>
                              </div>
                            )}
                          </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                          {valuations.dcf && (
                            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                              <h4 className="text-sm font-light text-gray-400 mb-3 uppercase tracking-wide">DCF Valuation</h4>
                              <p className="text-xs text-gray-600 mb-4 font-light">{valuations.dcf.description}</p>
                              <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                  <span className="text-xs text-gray-500 uppercase tracking-wider">Equity Value</span>
                                  <span className="text-lg font-light text-white">{formatNumber(valuations.dcf.equityValue)}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                  <span className="text-xs text-gray-500 uppercase tracking-wider">Per Share</span>
                                  <span className="text-lg font-light text-white">{valuations.dcf.perShare ? formatNumber(valuations.dcf.perShare) : 'N/A'}</span>
                                </div>
                              </div>
                            </div>
                          )}

                          {valuations.revenueMultiple?.applicable && (
                            <div className="bg-zinc-900 border border-blue-900 rounded-lg p-6">
                              <h4 className="text-sm font-light text-blue-400 mb-3 uppercase tracking-wide">Revenue Multiple</h4>
                              <p className="text-xs text-gray-600 mb-4 font-light">{valuations.revenueMultiple.description}</p>
                              <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                  <span className="text-xs text-gray-500 uppercase tracking-wider">Equity Value</span>
                                  <span className="text-lg font-light text-white">{formatNumber(valuations.revenueMultiple.equityValue)}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                  <span className="text-xs text-gray-500 uppercase tracking-wider">Per Share</span>
                                  <span className="text-lg font-light text-white">{valuations.revenueMultiple.perShare ? formatNumber(valuations.revenueMultiple.perShare) : 'N/A'}</span>
                                </div>
                              </div>
                            </div>
                          )}

                          {valuations.comparables && (
                            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                              <h4 className="text-sm font-light text-gray-400 mb-3 uppercase tracking-wide">Comparable Multiples</h4>
                              <p className="text-xs text-gray-600 mb-4 font-light">{valuations.comparables.description}</p>
                              <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                  <span className="text-xs text-gray-500 uppercase tracking-wider">P/E Valuation</span>
                                  <span className="text-lg font-light text-white">{formatNumber(valuations.comparables.peValuation)}</span>
                                </div>
                              </div>
                            </div>
                          )}

                          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                            <h4 className="text-sm font-light text-gray-400 mb-3 uppercase tracking-wide">Book Value</h4>
                            <p className="text-xs text-gray-600 mb-4 font-light">{valuations.bookValue.description}</p>
                            <div className="space-y-3">
                              <div className="flex justify-between items-center">
                                <span className="text-xs text-gray-500 uppercase tracking-wider">Total Value</span>
                                <span className="text-lg font-light text-white">{formatNumber(valuations.bookValue.total)}</span>
                              </div>
                              <div className="flex justify-between items-center">
                                <span className="text-xs text-gray-500 uppercase tracking-wider">Per Share</span>
                                <span className="text-lg font-light text-white">{valuations.bookValue.perShare ? formatNumber(valuations.bookValue.perShare) : 'N/A'}</span>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {activeTab === 'lbo' && lboModel && (
                      <div className="space-y-8">
                        {!lboModel.applicable ? (
                          <div className="bg-zinc-900 border border-red-900 rounded-lg p-6">
                            <h4 className="text-sm font-light text-red-400 mb-3 uppercase tracking-wide">LBO Not Applicable</h4>
                            <p className="text-gray-400 mb-4 font-light">{lboModel.reason}</p>
                            <div className="space-y-2 text-sm text-gray-500 mb-4">
                              {lboModel.ebitda !== undefined && (
                                <div className="flex justify-between">
                                  <span>Current EBITDA:</span>
                                  <span className={lboModel.ebitda > 0 ? 'text-green-400' : 'text-red-400'}>{formatNumber(lboModel.ebitda)}</span>
                                </div>
                              )}
                            </div>
                            <div className="p-3 bg-zinc-800 border border-zinc-700 rounded">
                              <p className="text-xs text-gray-400 font-light">{lboModel.suggestion}</p>
                            </div>
                          </div>
                        ) : (
                          <>
                            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                              <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Investment Returns</h4>
                              <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                <div>
                                  <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">IRR</p>
                                  <p className="text-3xl font-light text-green-500">{formatPercent(lboModel.returns.irr)}</p>
                                </div>
                                <div>
                                  <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">MOIC</p>
                                  <p className="text-3xl font-light text-white">{formatRatio(lboModel.returns.moic)}x</p>
                                </div>
                                <div>
                                  <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">Total Return</p>
                                  <p className="text-3xl font-light text-white">{formatNumber(lboModel.returns.totalReturn)}</p>
                                </div>
                                <div>
                                  <p className="text-xs text-gray-500 mb-2 uppercase tracking-wider font-medium">Equity Investment</p>
                                  <p className="text-3xl font-light text-white">{formatNumber(lboModel.entry.equityInvestment)}</p>
                                </div>
                              </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                              <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                                <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Entry</h4>
                                <div className="space-y-3">
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500 uppercase tracking-wider">Purchase Price</span>
                                    <span className="text-base font-light text-white">{formatNumber(lboModel.entry.purchasePrice)}</span>
                                  </div>
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500 uppercase tracking-wider">Debt Financing</span>
                                    <span className="text-base font-light text-white">{formatNumber(lboModel.entry.debtFinancing)}</span>
                                  </div>
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500 uppercase tracking-wider">Equity Investment</span>
                                    <span className="text-base font-light text-white">{formatNumber(lboModel.entry.equityInvestment)}</span>
                                  </div>
                                </div>
                              </div>

                              <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                                <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Exit (Year {lboModel.assumptions.holdingPeriod})</h4>
                                <div className="space-y-3">
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500 uppercase tracking-wider">Exit EV</span>
                                    <span className="text-base font-light text-white">{formatNumber(lboModel.exit.enterpriseValue)}</span>
                                  </div>
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500 uppercase tracking-wider">Remaining Debt</span>
                                    <span className="text-base font-light text-white">{formatNumber(lboModel.exit.debt)}</span>
                                  </div>
                                  <div className="flex justify-between items-center">
                                    <span className="text-xs text-gray-500 uppercase tracking-wider">Exit Equity Value</span>
                                    <span className="text-base font-light text-green-500">{formatNumber(lboModel.exit.equityValue)}</span>
                                  </div>
                                </div>
                              </div>
                            </div>

                            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                              <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">5-Year Projections</h4>
                              <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                  <thead>
                                    <tr className="border-b border-zinc-800">
                                      <th className="text-left text-xs text-gray-500 uppercase tracking-wider py-2">Year</th>
                                      <th className="text-right text-xs text-gray-500 uppercase tracking-wider py-2">Revenue</th>
                                      <th className="text-right text-xs text-gray-500 uppercase tracking-wider py-2">EBITDA</th>
                                      <th className="text-right text-xs text-gray-500 uppercase tracking-wider py-2">FCF</th>
                                      <th className="text-right text-xs text-gray-500 uppercase tracking-wider py-2">Debt Balance</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {lboModel.projections.map(proj => (
                                      <tr key={proj.year} className="border-b border-zinc-900">
                                        <td className="py-2 text-white font-light">{proj.year}</td>
                                        <td className="py-2 text-right text-gray-400 font-light">{formatNumber(proj.revenue)}</td>
                                        <td className="py-2 text-right text-gray-400 font-light">{formatNumber(proj.ebitda)}</td>
                                        <td className="py-2 text-right text-gray-400 font-light">{formatNumber(proj.fcf)}</td>
                                        <td className="py-2 text-right text-white font-light">{formatNumber(proj.debtBalance)}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </>
                        )}
                      </div>
                    )}

                    {activeTab === 'charts' && availableYears.length > 1 && (
                      <div className="space-y-6">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                            <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Revenue & Net Income</h4>
                            <div className="h-64">
                              <canvas id="revenue-chart"></canvas>
                            </div>
                          </div>
                          
                          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                            <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Profit Margins</h4>
                            <div className="h-64">
                              <canvas id="margins-chart"></canvas>
                            </div>
                          </div>
                          
                          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                            <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Cash Flow</h4>
                            <div className="h-64">
                              <canvas id="cashflow-chart"></canvas>
                            </div>
                          </div>
                          
                          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6">
                            <h4 className="text-sm font-light text-gray-400 mb-4 uppercase tracking-wide">Key Ratios</h4>
                            <div className="h-64">
                              <canvas id="ratios-chart"></canvas>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<FinancialAnalyzer />);
  </script>
</body>
</html>
